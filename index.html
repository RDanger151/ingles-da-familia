<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglês da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: uma coluna de leitura no celular, barra de abas fixa embaixo, uma tarefa por tela. */
  --bg:#f2f5f6; --surface:#ffffff; --soft:#e3edef; --ink:#13272e; --muted:#536a71; --line:#d2dde0;
  --primary:#0a6770; --primary-ink:#ffffff; --accent:#b8740a;
  --good:#1c7446; --good-bg:#e0f2e7; --bad:#ad322b; --bad-bg:#fbe5e3; --mid:#8a5a00; --mid-bg:#fbf0d6;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1a1f; --surface:#17272d; --soft:#1f343b; --ink:#e7eff1; --muted:#9db2b8; --line:#2c4047;
    --primary:#55c5cb; --primary-ink:#04262a; --accent:#f0b24a;
    --good:#74d6a0; --good-bg:#15382a; --bad:#ff9d93; --bad-bg:#45211e; --mid:#f2c56b; --mid-bg:#3d3016;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1a1f; --surface:#17272d; --soft:#1f343b; --ink:#e7eff1; --muted:#9db2b8; --line:#2c4047;
  --primary:#55c5cb; --primary-ink:#04262a; --accent:#f0b24a;
  --good:#74d6a0; --good-bg:#15382a; --bad:#ff9d93; --bad-bg:#45211e; --mid:#f2c56b; --mid-bg:#3d3016;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.1rem;font-family:var(--body);font-weight:700}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;font-size:1.15rem;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;min-height:44px;cursor:pointer}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
#main{max-width:640px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:16px}
body.flow #main{padding-bottom:40px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.navin{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#nav button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);cursor:pointer;min-height:58px;border-top:3px solid transparent}
#nav button.on{color:var(--primary);border-top-color:var(--primary);font-weight:700}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.flow #nav, body.bare #nav{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--soft);border-color:transparent}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:12px 18px;border-radius:var(--r);border:2px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:1.08rem;cursor:pointer;text-align:center}
.btn.sec{background:var(--surface);color:var(--primary)}
.btn.quiet{background:none;border-color:var(--line);color:var(--ink);font-weight:400}
.btn.huge{min-height:76px;font-size:1.3rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{border-color:var(--bad);background:none;color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
.stack{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;min-height:58px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:64px}
.listbtn .grow{flex:1;min-width:0}
.listbtn .tag{font-size:.78rem;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.listbtn .tag.done{background:var(--good-bg);color:var(--good)}
.listbtn .tag.next{background:var(--primary);color:var(--primary-ink)}
.listbtn:disabled{opacity:.55;cursor:default}
.en{font-size:1.25rem;font-weight:700}
.pt{color:var(--muted)}
.ins{font-weight:700}
.prompt{font-size:1.3rem;font-weight:700;text-wrap:balance}
.count{font-size:.85rem;color:var(--muted)}
.fhead{max-width:640px;margin:0 auto;padding:10px 16px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.fhead .exit{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.fhead .ft{display:flex;flex-direction:column;line-height:1.2;text-align:right}
.fhead .ft b{font-size:1rem} .fhead .ft small{color:var(--muted);font-size:.8rem}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.step{display:flex;flex-direction:column;gap:16px}
.ex{display:flex;flex-direction:column;gap:14px}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;border-left:6px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)} .fb.good strong{color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)} .fb.bad strong{color:var(--bad)}
.fb.mid{background:var(--mid-bg);border-color:var(--mid)} .fb.mid strong{color:var(--mid)}
.fb .why{font-size:.95rem}
.audio{display:flex;gap:8px;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:700;cursor:pointer}
.abtn.slow{border-color:var(--line);color:var(--ink);font-weight:400}
.abtn.big{min-height:64px;padding:12px 26px;font-size:1.15rem;background:var(--primary);color:var(--primary-ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:var(--r)}
.tiles.answer{border:2px dashed var(--line);background:var(--surface)}
.tiles.bank{background:var(--soft)}
.tile{min-height:48px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem;cursor:pointer}
.inp{width:100%;min-height:58px;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-size:1.15rem}
textarea.inp{min-height:130px;font-size:.85rem;word-break:break-all}
.linkbtn{background:none;border:0;color:var(--primary);text-decoration:underline;cursor:pointer;padding:10px 0;min-height:44px;text-align:left;font-size:.95rem}
.line{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.line.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.line .who{font-size:.8rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.line .l-en{font-size:1.12rem}
.line .l-pt{color:var(--muted);font-size:.98rem}
.line .l-pt.hid{filter:blur(6px);user-select:none}
.hideen .l-en{filter:blur(7px)}
.speak{display:flex;flex-direction:column;gap:10px}
.mic{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .mic{color:#201400}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mic{color:#201400}}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.mic.live{animation:none}.bar i{transition:none}}
.heard{display:flex;flex-direction:column;gap:4px}
.heard .w{font-size:1.2rem;font-weight:700}
.heard .w span{margin-right:.3em}
.heard .w .ok{color:var(--good)} .heard .w .no{color:var(--muted);text-decoration:underline dotted}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stages li{display:flex;gap:12px;align-items:baseline}
.stages .n{font-family:var(--display);font-weight:600;color:var(--accent);min-width:1.2em}
.week{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.week.cur{border:2px solid var(--accent)}
.week.off{opacity:.6}
.week .n{font-family:var(--display);font-weight:600;min-width:2em;color:var(--accent)}
.scale{position:relative;height:16px;border-radius:99px;background:var(--soft);margin:26px 0 30px}
.scale i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);min-width:6px}
.scale em{position:absolute;top:-24px;font-style:normal;font-size:.75rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.scale em::after{content:"";position:absolute;left:50%;top:22px;height:20px;border-left:2px solid var(--muted)}
.scale em.b{top:22px}.scale em.b::after{display:none}
.bubble{max-width:88%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--soft);border-color:transparent}
.chat{display:flex;flex-direction:column;gap:10px}
.timer{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums;text-align:center}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
summary{cursor:pointer;font-weight:700;min-height:32px}
details>*+*{margin-top:8px}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.note{border-left:4px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);font-size:.95rem}
.pairrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bubble .l-pt{color:var(--muted);font-size:.98rem}
.bubble .l-pt.hid{display:none}

</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<nav id="nav" aria-label="Abas"></nav>
<noscript><p style="padding:16px">Este site precisa de JavaScript ligado no navegador.</p></noscript>
<script>
/* ============================================================
   CONTEÚDO FIXO DO CURSO (separado do motor)
   Para acrescentar semanas: crie um bloco COURSE.weeks[N] = {...}
   no mesmo formato de content-w01-04.js. O motor não muda.
   ============================================================ */
window.COURSE = {
weeks: {},

/* Plano de 24 semanas: [título da trilha natural, ponto da trilha gramática, o que a pessoa passa a conseguir] */
plan: [
["Primeiros contatos","Verbo to be: am, is, are","cumprimentar, se apresentar e pedir para repetir"],
["Família, trabalho e rotina","Presente simples e perguntas com do/does","falar da família, do trabalho e do seu dia"],
["Comida e compras","There is, have, can, posse","pedir comida e bebida, perguntar preços e comprar"],
["Pela cidade","Present continuous, in/on/at, want to","pedir informações na rua, pegar transporte e combinar um encontro"],
["Em casa e na vizinhança","Passado do to be: was, were","descrever sua casa e dizer como as coisas eram"],
["O que aconteceu ontem","Passado simples: verbos regulares","contar o que você fez ontem"],
["O fim de semana","Passado simples: verbos irregulares","contar o fim de semana com os verbos mais comuns"],
["Saúde: médico e farmácia","Perguntas e negativas com did","explicar o que está sentindo e entender instruções simples"],
["Telefone e mensagens","Futuro com going to","marcar, confirmar e cancelar compromissos"],
["No trabalho","Will: decisões e promessas","falar de tarefas, oferecer ajuda e combinar prazos"],
["Viagem: aeroporto e hotel","Can, could, would: pedidos educados","fazer check-in, pedir coisas e resolver problemas simples"],
["Restaurante e convites","Should, have to, must","convidar, aceitar, recusar e dar conselhos"],
["Contar uma história","Passado contínuo: was doing","contar uma história com começo, meio e fim"],
["Opiniões","Comparativos e superlativos","dar opinião, concordar e discordar com educação"],
["Planos e sonhos","Present perfect: experiências","falar do que já fez na vida e do que quer fazer"],
["Problemas e reclamações","Present perfect ou passado simples","reclamar com educação e pedir solução"],
["Novidades","For, since, already, yet","contar novidades e perguntar pelas dos outros"],
["E se…?","Primeira condicional","falar de possibilidades reais e combinar alternativas"],
["Imaginando","Segunda condicional","falar de situações imaginárias"],
["Fala real","Verbos frasais mais comuns","entender a fala rápida com ligações: gonna, wanna, gotta"],
["Sua vida em inglês","Revisão dos tempos verbais","falar por alguns minutos sobre sua vida"],
["Conversas longas","Perguntas indiretas e educadas","manter uma conversa de dez minutos"],
["Mais rápido","Conectores: so, because, although","dizer com rapidez o que você já sabe"],
["Reta final","Revisão geral","conversar sobre o cotidiano com confiança e seguir sozinho"]
],
phases: [[1,4,"Sons do inglês, sobrevivência e apresentações"],[5,12,"Dia a dia, presente e passado, primeiras conversas completas"],[13,20,"Histórias, opiniões, planos e hipóteses, fala real"],[21,24,"Consolidação, fluência e conversas longas"]],

/* Teste de nivelamento. t = nível (1 a 4). tipo l = ouvir, r = ler, g = lacuna. A primeira opção é a correta. */
placement: [
{t:1,k:"l",en:"Good morning! How are you?",q:"O que você ouviu?",o:["Bom dia! Como vai?","Boa noite! Quem é você?","Bom dia! Onde você está?"]},
{t:1,k:"l",en:"What's your name?",q:"O que a pessoa quer saber?",o:["Seu nome","Sua idade","Onde você mora"]},
{t:1,k:"r",en:"I'm from Brazil.",q:"O que quer dizer?",o:["Eu sou do Brasil.","Eu vou para o Brasil.","Eu gosto do Brasil."]},
{t:1,k:"g",en:"She ___ my sister.",q:"Qual palavra completa a frase?",o:["is","am","are"]},
{t:2,k:"l",en:"Where do you work?",q:"O que a pessoa quer saber?",o:["Onde você trabalha","Quando você trabalha","Se você gosta do trabalho"]},
{t:2,k:"l",en:"How much is this jacket?",q:"O que a pessoa quer saber?",o:["O preço da jaqueta","O tamanho da jaqueta","A cor da jaqueta"]},
{t:2,k:"g",en:"He ___ in a bank.",q:"Qual palavra completa a frase?",o:["works","work","working"]},
{t:2,k:"g",en:"I ___ like coffee.",q:"Como dizer “eu não gosto de café”?",o:["don't","not","am not"]},
{t:3,k:"l",en:"I went to the supermarket yesterday, but it was closed.",q:"O que aconteceu?",o:["A pessoa foi ao supermercado ontem e estava fechado.","A pessoa vai ao supermercado amanhã.","A pessoa trabalha em um supermercado."]},
{t:3,k:"g",en:"We ___ a movie last night.",q:"Qual palavra completa a frase?",o:["watched","watch","are watching"]},
{t:3,k:"l",en:"Excuse me, can you tell me where the train station is?",q:"O que a pessoa quer?",o:["Saber onde fica a estação de trem","Saber a que horas o trem sai","Comprar uma passagem de trem"]},
{t:3,k:"g",en:"There ___ two cars in front of the house.",q:"Qual palavra completa a frase?",o:["are","is","have"]},
{t:4,k:"l",en:"I've lived here for ten years, but I'm thinking about moving next year.",q:"O que é verdade?",o:["A pessoa mora lá há dez anos e pensa em se mudar.","A pessoa se mudou há dez anos para outra cidade.","A pessoa vai morar lá por dez anos."]},
{t:4,k:"g",en:"If I ___ time tomorrow, I'll call you.",q:"Qual palavra completa a frase?",o:["have","will have","had"]},
{t:4,k:"l",en:"You should have told me earlier.",q:"O que quer dizer?",o:["Você devia ter me contado antes.","Você deve me contar depois.","Você me contou cedo."]},
{t:4,k:"g",en:"She has ___ finished the report.",q:"Como dizer “ela já terminou o relatório”?",o:["already","yet","still"]}
],

/* Sons difíceis. type pair = pares mínimos; type cat = classificar o som. */
sounds: [
{id:"th1",name:"TH de “think”",ipa:"/θ/ contra /s/ e /t/",
 how:"Ponha a ponta da língua entre os dentes, de leve, e sopre. Não é “s”, não é “f” e não é “t”. A língua aparece um pouquinho.",
 approx:"think soa perto de “tfink” com a língua entre os dentes, nunca “sink” nem “tink”.",
 type:"pair",pairs:[["think","sink"],["thank","tank"],["three","tree"],["thin","tin"],["thick","sick"],["mouth","mouse"],["path","pass"],["thought","taught"]]},
{id:"th2",name:"TH de “this”",ipa:"/ð/ contra /d/",
 how:"Mesma posição: ponta da língua entre os dentes. Agora ligue a voz, como um zumbido. Não é “d”.",
 approx:"this soa perto de “dis”, mas com a língua entre os dentes vibrando.",
 type:"pair",pairs:[["they","day"],["then","den"],["those","doze"],["there","dare"],["than","Dan"],["breathe","breeze"]]},
{id:"hr",name:"H e R no começo",ipa:"/h/ contra /r/",
 how:"O H inglês é o nosso “r” de “rato”: só um sopro. O R inglês é outro som: a língua se enrola para trás sem tocar em nada, como o “r” caipira de “porta”.",
 approx:"hat soa “rét”. red soa “uréd”, com biquinho. Se você disser red com o nosso “r”, o americano ouve head.",
 type:"pair",pairs:[["hat","rat"],["head","red"],["hide","ride"],["home","Rome"],["hope","rope"],["hate","rate"],["hole","role"],["hug","rug"]]},
{id:"iee",name:"Vogais curtas e longas",ipa:"/ɪ/ contra /iː/ e /ʊ/ contra /uː/",
 how:"O som longo (sheep) é o nosso “i”, esticado e sorrindo. O curto (ship) é rápido e relaxado, entre “i” e “ê”. O mesmo vale para fool (longo, com biquinho) e full (curto e relaxado).",
 approx:"sheep = “xiip”. ship = “xêp” bem curto. fool = “fuul”. full = “fôl” bem curto.",
 type:"pair",pairs:[["ship","sheep"],["it","eat"],["live","leave"],["sit","seat"],["fill","feel"],["chip","cheap"],["hit","heat"],["full","fool"],["pull","pool"]]},
{id:"ae",name:"A aberto de “bad”",ipa:"/æ/ contra /ɛ/",
 how:"Para bad, abra bem a boca, como quem vai dizer “a”, mas diga “é”. Para bed, a boca abre menos: é o nosso “é” normal.",
 approx:"bad = “béa-d” com a boca bem aberta. bed = “béd”.",
 type:"pair",pairs:[["bad","bed"],["man","men"],["sad","said"],["pan","pen"],["bag","beg"],["had","head"],["sat","set"],["land","lend"]]},
{id:"mnl",name:"M, N e L no fim",ipa:"/m/ /n/ /l/ finais",
 how:"Em português, “m” e “n” no fim só deixam a vogal nasal, e o “l” vira “u”. Em inglês você fecha de verdade: lábios juntos no M, língua no céu da boca atrás dos dentes no N e no L.",
 approx:"some termina com os lábios fechados. sun termina com a língua em cima. goal não é “gou”: a língua sobe no fim.",
 type:"pair",pairs:[["some","sun"],["them","then"],["came","cane"],["gum","gun"],["team","teen"],["goal","go"],["bowl","bow"],["tool","two"],["feel","fee"],["mile","my"]]},
{id:"ed",name:"As três pronúncias do -ED",ipa:"/t/ /d/ /ɪd/",
 how:"O -ed quase nunca é uma sílaba a mais. Depois de som sem voz (k, p, s, sh, ch, f) soa T: worked = “uôrkt”. Depois de som com voz soa D: played = “plêid”. Só depois de T ou D ele vira uma sílaba: wanted = “uón-tid”.",
 approx:"worked tem uma sílaba só. Nunca “uôr-ked”.",

{id:"s",name:"O -S do fim",ipa:"/s/ /z/ finais",

/* Página "Por que este método funciona": [título, fonte, explicação, como o site aplica] */
method: [
["Lembrar é melhor que reler","Roediger e Karpicke, 2006; Dunlosky e colegas, 2013","Quando você se esforça para puxar uma resposta da memória, ela fica mais forte do que se você só lesse de novo.","Aqui você sempre responde antes de ver o gabarito: fala, monta ou escreve a frase, e a correção vem na hora."],
["Um pouco todo dia, com intervalos","Ebbinghaus, 1885; Cepeda e colegas, 2006","A memória esquece em curva. Rever logo antes de esquecer, com intervalos cada vez maiores, segura o que você aprendeu por muito mais tempo.","Cada frase volta em 1, 3, 7, 14, 30, 60 e 120 dias. Acertou, o intervalo cresce. Errou, ela volta para perto."],
["Misturar os assuntos","Rohrer e Taylor, 2007; Nakata e Suzuki, 2019","Praticar temas misturados parece mais difícil, mas faz você aprender a escolher a resposta certa, como na vida real.","As revisões misturam frases de lições diferentes e tipos de exercício diferentes."],
["Dificuldade na medida certa","Bjork, 1994","Exercício fácil demais não fixa; difícil demais desanima. O melhor é um esforço que você quase sempre vence.","O site observa seus acertos. Se você acerta quase tudo, os exercícios ficam mais exigentes; se erra muito, ficam mais simples."],
["Quatro partes iguais","Paul Nation, 2007","Um bom curso divide o tempo entre ouvir e ler entendendo, falar e escrever, estudar a língua de propósito e ganhar velocidade com o que já sabe.","A sessão diária passa pelas quatro: história com áudio, produção, exercícios de vocabulário e pronúncia, e rodadas rápidas."],
["As palavras mais usadas primeiro","West, 1953; Nation, 2001; Browne, Culligan e Phillips, 2013","Cerca de duas mil palavras cobrem a maior parte das conversas do dia a dia. Faz sentido aprender essas antes de qualquer palavra rara.","O curso segue as palavras e combinações mais frequentes da fala, sempre dentro de frases, nunca em listas soltas."],
["Entender muito, com poucas novidades","Krashen, 1982; Nation e Waring, 2020","Aprendemos quando entendemos mensagens um pouco acima do nosso nível, em grande quantidade.","Cada lição traz um diálogo curto em que você entende quase tudo, com áudio e tradução escondida que aparece ao toque."],
["Falar e ser corrigido","Swain, 1985; Long, 1996","Só entender não basta. Ao tentar falar, você percebe o que ainda não sabe, e a correção ajusta.","Toda sessão termina com você falando sobre a sua vida, e o simulador de conversas responde ao que você diz."],
["Frases prontas","Lewis, 1993; Wray, 2002","Quem fala rápido não monta palavra por palavra: usa blocos inteiros já decorados, como “Can I have…?”.","Você aprende blocos e troca só um pedaço para criar frases novas."],
["Explicar a regra ajuda","Norris e Ortega, 2000; Spada e Tomita, 2010","Estudos que juntam dezenas de pesquisas mostram que uma explicação curta e clara acelera o aprendizado em comparação com só exposição.","A trilha Gramática explica cada ponto e compara com o português. A trilha Natural oferece a nota opcional “Quer saber por quê?”."],
["Treinar o ouvido com variedade","Logan, Lively e Pisoni, 1991; Thomson, 2018","Para aprender um som que não existe na sua língua, você precisa ouvi-lo em muitas palavras e vozes, com correção imediata.","Na aba Falar, você ouve pares como ship e sheep em várias palavras, vozes e velocidades e escolhe o que ouviu."],
["Repetir junto com o áudio","Hamada, 2016; Foote e McDonough, 2017","Ouvir e repetir imitando o modelo melhora a percepção dos sons, o ritmo e a melodia.","Toda sessão tem de três a cinco frases para repetir, em velocidade lenta e normal."],
["Dormir faz parte do estudo","Diekelmann e Born, 2010","O cérebro consolida a memória durante o sono, entre uma sessão e outra.","O site pede de 20 a 30 minutos por dia, todos os dias, em vez de maratonas no fim de semana."],
["Motivação e escolha","Deci e Ryan, 2000; Dörnyei, 2001","A gente continua quando vê progresso real, sente que escolhe e não é punido por falhar.","Você vê o que já consegue fazer, escolhe trilha e lições, e nunca perde progresso por faltar um dia."]
],

"g|They ___ at work.|are|is,am|Eles estão no trabalho.|Com we, you e they, sempre are.",

{id:"g1-3",t:"Não sou, não é: a negativa",
ex:"Para negar, ponha <b>not</b> depois do verbo to be: <b>I'm not</b>, <b>you're not</b> ou <b>you aren't</b>, <b>he's not</b> ou <b>he isn't</b>. Em português o “não” vem antes do verbo; em inglês o not vem <b>depois</b>.",
err:["Nunca “I no am” nem “I not am”. A ordem é <b>I am not</b>.","Não existe “amn't”. Com I, só <b>I'm not</b>."],
e:["I'm not tired.|Eu não estou cansado.","She isn't here.|Ela não está aqui.","It isn't expensive.|Não é caro.","We aren't late.|Nós não estamos atrasados.","He's not my boss.|Ele não é meu chefe.","They aren't at home.|Eles não estão em casa."],
d:["Ana|Is Biscuit your cat?|O Biscuit é seu gato?","Ben|No, he isn't. He's not my cat.|Não é. Ele não é meu gato.","Ana|But he's in your apartment.|Mas ele está no seu apartamento.","Ben|I know. I'm not happy about it.|Eu sei. Não estou feliz com isso."],
x:["g|I'm ___ tired.|not|no,don't|Eu não estou cansado.|A negativa do to be usa not.",
"g|She ___ here.|isn't|aren't,not|Ela não está aqui.|She pede is; a negativa é isn't.",
"t|It is expensive.|Passe para a negativa.|It isn't expensive./It's not expensive./It is not expensive.|O not vem depois do is.",
"t|We are late.|Passe para a negativa.|We aren't late./We're not late./We are not late.|O not vem depois do are.",
"b|Ele não é meu chefe.|He's not my boss./He isn't my boss./He is not my boss.",
"x|Eles não estão em casa.|They aren't at home./They're not at home./They are not at home./They aren't home./They're not home.|They pede are; a negativa é aren't.",
"x|Eu não sou americano.|I'm not American./I am not American.|Com I, só I'm not.",
"s|I'm not tired, and I'm not late.|Não estou cansado e não estou atrasado."],
p:["Diga uma coisa que você não é.|I'm not ___.","Diga onde uma pessoa da família não está agora.|He isn't ___. / She isn't ___.","Diga como o tempo não está hoje.|It isn't ___ today."]},

{id:"g1-4",t:"Perguntas com to be",
ex:"Para perguntar, o verbo vai para a frente: <b>You are</b> tired vira <b>Are you</b> tired? Em português só muda a entonação; em inglês muda a <b>ordem</b>. A resposta curta repete o verbo: <b>Yes, I am.</b> <b>No, I'm not.</b>",
err:["“You are tired?” com voz de pergunta soa estranho. Inverta: <b>Are you tired?</b>","Na resposta curta positiva não se usa a forma curta: <b>Yes, I am</b>, nunca “Yes, I'm”."],
e:["Are you okay?|Você está bem?","Is she your sister?|Ela é sua irmã?","Is it far?|É longe?","Are they here?|Eles estão aqui?","Where are you from?|De onde você é?","How old is he?|Quantos anos ele tem?"],
d:["Mrs. Parker|Are you hungry, dear?|Você está com fome, querida?","Ana|Yes, I am. Is that cake?|Estou, sim. Aquilo é bolo?","Mrs. Parker|It is. Is Ben at home?|É. O Ben está em casa?","Ana|No, he isn't. More cake for us.|Não está. Mais bolo para nós."],
x:["t|You are okay.|Faça a pergunta.|Are you okay?|O are vai para a frente.",
"t|She is your sister.|Faça a pergunta.|Is she your sister?|O is vai para a frente.",
"g|___ they here?|Are|Is,Am|Eles estão aqui?|They pede are.",
"g|Are you tired? Yes, I ___.|am|'m,are|Você está cansado? Estou.|Resposta curta positiva: Yes, I am.",
"b|É longe?|Is it far?",
"b|De onde você é?|Where are you from?",
"x|Quantos anos ele tem?|How old is he?|Idade usa to be: How old is he?",
"s|Are you okay? Is it far?|Você está bem? É longe?"],
p:["Pergunte a alguém se está com fome.|Are you ___?","Pergunte de onde a pessoa é.|Where ___?","Responda: Are you Brazilian?|Yes, I am. / No, I'm not."]},

{id:"g1-5",t:"A, an, this, that",
ex:"<b>A</b> e <b>an</b> são “um, uma”. Use <b>an</b> antes de som de vogal: an apple, an hour. Profissão sempre leva a ou an: <b>I'm a teacher</b>. <b>This</b> é o que está perto (este, isto); <b>that</b> é o que está longe (aquele, aquilo).",
err:["Em português dizemos “Sou professor”. Em inglês falta o artigo se você disser “I'm teacher”. O certo é <b>I'm a teacher</b>.","O que manda é o som, não a letra: <b>an hour</b> (o h é mudo), <b>a university</b> (começa com som de “iu”)."],
e:["I'm a teacher.|Eu sou professor.","She's an engineer.|Ela é engenheira.","This is my phone.|Este é o meu celular.","That's my car.|Aquele é o meu carro.","What's this?|O que é isto?","It's an old house.|É uma casa velha."],
d:["Ana|What's that?|O que é aquilo?","Ben|That's my dinner. It's an omelet.|É o meu jantar. É uma omelete.","Ana|Is this an egg or a rock?|Isto é um ovo ou uma pedra?","Ben|This is a work of art, Ana.|Isto é uma obra de arte, Ana."],
x:["g|I'm ___ teacher.|a|an,the|Eu sou professor.|Profissão leva a ou an.",
"g|She's ___ engineer.|an|a,the|Ela é engenheira.|Engineer começa com som de vogal: an.",
"g|___ is my phone, here in my hand.|This|That,It|Este é o meu celular, aqui na minha mão.|Perto de você: this.",
"b|Aquele é o meu carro.|That's my car./That is my car.",
"b|O que é isto?|What's this?/What is this?",
"x|Eu sou motorista.|I'm a driver./I am a driver.|Não esqueça o a.",
"x|É uma casa velha.|It's an old house./It is an old house.|Old começa com vogal: an old house.",
"s|This is my phone, and that's my car.|Este é o meu celular e aquele é o meu carro."],
p:["Diga a sua profissão, ou a de alguém da família.|I'm a ___. / He's a ___.","Aponte para algo perto e diga o que é.|This is my ___.","Aponte para algo longe e diga o que é.|That's a ___."]}
]);

put(2,[
{id:"g2-1",t:"Presente simples: I work, I live",
ex:"Para falar de rotina e de fatos, use o verbo na forma básica: <b>I work</b>, <b>you live</b>, <b>we like</b>, <b>they have</b>. O verbo não muda com I, you, we e they. Em português cada pessoa tem uma terminação; aqui é uma forma só.",
err:["Não use to be junto com outro verbo: “I am work” está errado. É <b>I work</b>.","O sujeito é obrigatório: “Moro em São Paulo” é <b>I live in São Paulo</b>."],
e:["I work every day.|Eu trabalho todo dia.","I live in a small apartment.|Eu moro em um apartamento pequeno.","We have two kids.|Nós temos dois filhos.","They like coffee.|Eles gostam de café.","You speak very well.|Você fala muito bem.","I get up early.|Eu acordo cedo."],
d:["Ben|I work from home, so I get up late.|Eu trabalho de casa, então acordo tarde.","Ana|I get up at five. We live in different worlds.|Eu acordo às cinco. A gente vive em mundos diferentes.","Ben|But we have the same cat problem.|Mas temos o mesmo problema com o gato.","Ana|True. They like my couch now.|Verdade. Agora eles gostam do meu sofá."],
x:["g|I ___ in Brazil.|live|am live,lives|Eu moro no Brasil.|Com I, o verbo fica na forma básica.",
"g|We ___ two kids.|have|has,are have|Nós temos dois filhos.|Com we, o verbo fica na forma básica.",
"b|Eu trabalho todo dia.|I work every day.",
"b|Eles gostam de café.|They like coffee.",
"t|I am work at a bank.|Corrija a frase.|I work at a bank.|Não se junta am com outro verbo.",
"x|Eu acordo cedo.|I get up early./I wake up early.|Acordar é get up ou wake up.",
"x|Você fala muito bem.|You speak very well.|Very well vem no fim.",
"s|I live in Brazil, and I work every day.|Eu moro no Brasil e trabalho todo dia."],
p:["Diga onde você mora.|I live in ___.","Diga a que horas você acorda.|I get up at ___.","Diga uma coisa de que você e sua família gostam.|We like ___."]},

{id:"g2-2",t:"He works, she lives: o -s",
ex:"Com <b>he, she, it</b> o verbo ganha <b>-s</b>: he work<b>s</b>, she live<b>s</b>, it open<b>s</b>. Alguns mudam um pouco: have vira <b>has</b>, go vira <b>goes</b>, do vira <b>does</b>, watch vira <b>watches</b>, study vira <b>studies</b>.",
err:["É o erro mais comum de brasileiros: “She work”. Com he, she e it, sempre <b>works</b>.","“He have” não existe. É <b>he has</b>."],
e:["She works at a hospital.|Ela trabalha em um hospital.","He lives next door.|Ele mora ao lado.","My mother has a cat.|Minha mãe tem um gato.","He goes to work by bus.|Ele vai para o trabalho de ônibus.","The store opens at nine.|A loja abre às nove.","She watches TV at night.|Ela vê TV à noite."],
d:["Ana|Does Mrs. Parker live alone?|A Sra. Parker mora sozinha?","Ben|Yes. Well, she has Biscuit.|Mora. Bom, ela tem o Biscuit.","Ana|He eats a lot.|Ele come muito.","Ben|He eats, he sleeps, and he watches us.|Ele come, dorme e fica olhando para a gente."],
x:["g|She ___ at a hospital.|works|work,working|Ela trabalha em um hospital.|Com she, o verbo ganha -s.",
"g|My mother ___ a cat.|has|have,haves|Minha mãe tem um gato.|Have vira has com he, she e it.",
"g|He ___ to work by bus.|goes|go,gos|Ele vai para o trabalho de ônibus.|Go vira goes.",
"t|I live next door.|Troque I por He.|He lives next door.|Com he, lives.",
"t|They watch TV at night.|Troque They por She.|She watches TV at night.|Watch vira watches.",
"b|A loja abre às nove.|The store opens at nine.",
"x|Meu pai trabalha muito.|My father works a lot./My dad works a lot.|My father é he, então works.",
"s|She works at a hospital, and he works from home.|Ela trabalha em um hospital e ele trabalha de casa."],
p:["Diga onde alguém da sua família mora.|My ___ lives in ___.","Diga o que alguém da família faz.|He works at ___. / She works at ___.","Diga uma coisa que essa pessoa tem.|He has ___. / She has ___."]},

{id:"g2-3",t:"Don't e doesn't: a negativa",
ex:"Para negar no presente, use <b>don't</b> antes do verbo: I <b>don't</b> like fish. Com he, she e it, use <b>doesn't</b>, e o verbo volta para a forma básica, sem -s: she <b>doesn't like</b> fish. O -s já está no doesn't.",
err:["“I no like” e “I not like” estão errados. É <b>I don't like</b>.","Depois de doesn't o verbo perde o -s: <b>She doesn't work</b>, nunca “She doesn't works”."],
e:["I don't like fish.|Eu não gosto de peixe.","I don't understand.|Eu não entendo.","She doesn't work on Sundays.|Ela não trabalha aos domingos.","He doesn't have a car.|Ele não tem carro.","We don't live here.|Nós não moramos aqui.","It doesn't matter.|Não importa."],
d:["Ben|I don't understand. The cake is gone.|Não entendo. O bolo sumiu.","Ana|Mrs. Parker doesn't eat cake at night.|A Sra. Parker não come bolo à noite.","Ben|And you don't have a key.|E você não tem a chave.","Ana|Biscuit doesn't need a key, Ben.|O Biscuit não precisa de chave, Ben."],
x:["g|I ___ like fish.|don't|doesn't,not|Eu não gosto de peixe.|Com I, a negativa é don't.",
"g|She ___ work on Sundays.|doesn't|don't,isn't|Ela não trabalha aos domingos.|Com she, a negativa é doesn't.",
"g|He doesn't ___ a car.|have|has,haves|Ele não tem carro.|Depois de doesn't, forma básica.",
"t|I understand.|Passe para a negativa.|I don't understand./I do not understand.|Don't vem antes do verbo.",
"t|He lives here.|Passe para a negativa.|He doesn't live here./He does not live here.|Doesn't, e o verbo perde o -s.",
"b|Não importa.|It doesn't matter./It does not matter.",
"x|Nós não moramos aqui.|We don't live here./We do not live here.|Com we, don't.",
"s|I don't like fish, and she doesn't like coffee.|Eu não gosto de peixe e ela não gosta de café."],
p:["Diga uma coisa de que você não gosta.|I don't like ___.","Diga algo que você não tem.|I don't have ___.","Diga o que alguém da família não faz.|He doesn't ___. / She doesn't ___."]},

{id:"g2-4",t:"Perguntas com do e does",
ex:"Para perguntar no presente, comece com <b>Do</b>: <b>Do you</b> like coffee? Com he, she e it, comece com <b>Does</b> e deixe o verbo na forma básica: <b>Does she</b> work here? O português não tem nada parecido: do e does só avisam que vem uma pergunta. Respostas curtas: <b>Yes, I do.</b> <b>No, she doesn't.</b>",
err:["“You like coffee?” funciona entre amigos, mas o padrão é <b>Do you like coffee?</b>","Não misture com to be: “Are you work here?” está errado. É <b>Do you work here?</b>"],
e:["Do you like coffee?|Você gosta de café?","Do you work here?|Você trabalha aqui?","Does she live near here?|Ela mora perto daqui?","Does he speak English?|Ele fala inglês?","Do they have kids?|Eles têm filhos?","Do you need help?|Você precisa de ajuda?"],
d:["Mrs. Parker|Do you like tea, dear?|Você gosta de chá, querida?","Ana|Yes, I do. Thank you.|Gosto, sim. Obrigada.","Mrs. Parker|Does Ben know about the cake?|O Ben sabe do bolo?","Ana|No, he doesn't. Let's keep it that way.|Não sabe. Vamos deixar assim."],
x:["g|___ you like coffee?|Do|Does,Are|Você gosta de café?|Com you, a pergunta começa com Do.",
"g|___ she live near here?|Does|Do,Is|Ela mora perto daqui?|Com she, a pergunta começa com Does.",
"g|Does he ___ English?|speak|speaks,speaking|Ele fala inglês?|Depois de does, forma básica.",
"t|You work here.|Faça a pergunta.|Do you work here?|Do vem antes do sujeito.",
"t|She has a car.|Faça a pergunta.|Does she have a car?|Does, e has volta para have.",
"b|Eles têm filhos?|Do they have kids?/Do they have children?",
"x|Você precisa de ajuda?|Do you need help?|Need não pede “de” depois.",
"s|Do you like coffee? Does she like tea?|Você gosta de café? Ela gosta de chá?"],
p:["Pergunte a alguém se gosta de música.|Do you ___?","Pergunte se a mãe de alguém mora perto.|Does your mother ___?","Responda: Do you speak English?|Yes, I do. A little."]},

{id:"g2-5",t:"What, where, when, how",
ex:"A palavra de pergunta vem primeiro; depois a ordem é a mesma: <b>Where do you</b> live? <b>What does she</b> do? <b>When do they</b> open? Com to be não há do: <b>Where is</b> the bank? As principais: what (o quê), where (onde), when (quando), who (quem), why (por quê), how (como).",
err:["Não esqueça o do: “Where you live?” está errado. É <b>Where do you live?</b>","“What do you do?” pergunta a profissão. O segundo do é o verbo “fazer”."],
e:["Where do you live?|Onde você mora?","What do you do?|O que você faz?","What time do you get up?|A que horas você acorda?","Where does he work?|Onde ele trabalha?","When does the store open?|Quando a loja abre?","Why do you ask?|Por que você pergunta?"],
d:["Ben|Where do you go every Sunday?|Aonde você vai todo domingo?","Ana|Why do you ask?|Por que você pergunta?","Ben|Mrs. Parker wants to know.|A Sra. Parker quer saber.","Ana|What does she do all day? Watch me?|O que ela faz o dia todo? Fica me vigiando?"],
x:["g|Where ___ you live?|do|does,are|Onde você mora?|Com you, do.",
"g|Where ___ he work?|does|do,is|Onde ele trabalha?|Com he, does.",
"b|O que você faz?|What do you do?",
"b|A que horas você acorda?|What time do you get up?/What time do you wake up?",
"t|The store opens at nine.|Pergunte quando.|When does the store open?|Does, e opens volta para open.",
"t|You live in Chicago.|Pergunte onde.|Where do you live?|Where vem primeiro, depois do you.",
"x|Por que você pergunta?|Why do you ask?|Why vem primeiro, depois do you.",
"s|Where do you live, and what do you do?|Onde você mora e o que você faz?"],
p:["Pergunte onde a pessoa trabalha.|Where ___?","Pergunte a que horas a pessoa acorda.|What time ___?","Responda: What do you do?|I'm a ___. / I work at ___."]}
]);

put(3,[
{id:"g3-1",t:"There is e there are",
ex:"Para dizer que algo existe, o inglês usa <b>there is</b> (uma coisa) e <b>there are</b> (várias). É o nosso “tem” ou “há”: <b>There's a bank</b> near here. <b>There are two parks</b>. Pergunta: <b>Is there…?</b> <b>Are there…?</b> Negativa: <b>There isn't</b>, <b>there aren't</b>.",
err:["O erro mais típico: “Have a bank near here”. Para “tem” no sentido de existir, é <b>There's a bank near here</b>.","Plural pede are: <b>There are two cars</b>, não “There is two cars”."],
e:["There's a bank near here.|Tem um banco aqui perto.","There are two parks.|Tem dois parques.","Is there a pharmacy near here?|Tem uma farmácia aqui perto?","There isn't any milk.|Não tem leite.","Are there any eggs?|Tem ovos?","There's a problem.|Tem um problema."],

x:["g|___ a bank near here.|There's|Have,It has|Tem um banco aqui perto.|“Tem” de existir é there is.",
"g|There ___ two parks.|are|is,have|Tem dois parques.|Plural pede there are.",
"g|___ there a pharmacy near here?|Is|Has,Are|Tem uma farmácia aqui perto?|Na pergunta, o is vai para a frente.",
"t|There is a problem.|Passe para a negativa.|There isn't a problem./There is not a problem./There's no problem.|Not depois do is.",
"b|Tem ovos?|Are there any eggs?",
"x|Tem um problema.|There's a problem./There is a problem.|Não use have aqui.",
"x|Não tem leite.|There isn't any milk./There is no milk./There's no milk.|Na negativa, any antes da coisa.",
"s|There's a bank and there are two parks near here.|Tem um banco e dois parques aqui perto."],
p:["Diga o que tem perto da sua casa.|There's a ___ near my home.","Diga o que tem na sua geladeira.|There's ___. / There are ___.","Diga o que não tem no seu bairro.|There isn't a ___."]},

{id:"g3-2",t:"Have e has: ter, de posse",
ex:"<b>Have</b> é “ter” quando alguém possui algo: <b>I have</b> a car. Com he, she e it é <b>has</b>. Negativa e pergunta usam do e does: I <b>don't have</b>, <b>Do you have…?</b> Compare: <b>I have</b> a bank account (posse) e <b>there's</b> a bank near here (existência).",
err:["“I haven't a car” soa antigo. No inglês americano é <b>I don't have a car</b>.","Fome, sede, sono, frio e medo usam to be, não have: <b>I'm hungry, I'm thirsty, I'm sleepy, I'm cold, I'm afraid</b>."],
e:["I have a question.|Eu tenho uma pergunta.","She has two jobs.|Ela tem dois empregos.","I don't have time.|Eu não tenho tempo.","Do you have a minute?|Você tem um minuto?","He doesn't have a phone.|Ele não tem celular.","I'm hungry.|Estou com fome."],
d:["Ben|Do you have a minute?|Você tem um minuto?","Ana|I have five. I'm hungry and I have a sandwich.|Tenho cinco. Estou com fome e tenho um sanduíche.","Ben|I have a small problem. I don't have my keys.|Tenho um probleminha. Não estou com as minhas chaves.","Ana|Biscuit has them, right?|Estão com o Biscuit, né?"],
x:["g|She ___ two jobs.|has|have,is|Ela tem dois empregos.|Com she, has.",
"g|I ___ have time.|don't|haven't,am not|Eu não tenho tempo.|A negativa de have usa don't.",
"g|I ___ hungry.|am|have,has|Estou com fome.|Fome usa to be: I'm hungry.",
"t|You have a minute.|Faça a pergunta.|Do you have a minute?|Pergunta com Do.",
"t|He has a phone.|Passe para a negativa.|He doesn't have a phone./He does not have a phone.|Doesn't, e has volta para have.",
"b|Eu tenho uma pergunta.|I have a question.",
"x|Estou com sede.|I'm thirsty./I am thirsty.|Sede usa to be.",
"s|I have a question. Do you have a minute?|Tenho uma pergunta. Você tem um minuto?"],
p:["Diga uma coisa que você tem.|I have ___.","Diga uma coisa que você não tem.|I don't have ___.","Diga como você está: hungry, thirsty, sleepy, cold.|I'm ___."]},

{id:"g3-3",t:"My, your, his, her e o 's",
ex:"<b>My</b> (meu), <b>your</b> (seu), <b>his</b> (dele), <b>her</b> (dela), <b>our</b> (nosso), <b>their</b> (deles). Não mudam com plural nem com gênero: my friend, my friends. Para dizer de quem é, use <b>'s</b>: <b>Ana's phone</b> é “o celular da Ana”. A ordem é o contrário do português.",
err:["“The phone of Ana” não se diz. É <b>Ana's phone</b>.","His e her dependem do dono, não da coisa: “a mãe dele” é <b>his mother</b>; “o pai dela” é <b>her father</b>."],
e:["This is my sister.|Esta é a minha irmã.","What's your name?|Qual é o seu nome?","His mother is a teacher.|A mãe dele é professora.","Her father lives in Brazil.|O pai dela mora no Brasil.","That's Ben's car.|Aquele é o carro do Ben.","Our house is small.|Nossa casa é pequena."],
d:["Ana|Is this your jacket?|Esta jaqueta é sua?","Ben|No, that's my brother's jacket.|Não, é a jaqueta do meu irmão.","Ana|And his name is…?|E o nome dele é…?","Ben|Bill. Our mother isn't very creative.|Bill. Nossa mãe não é muito criativa."],

"g|___ father lives in Brazil. (dela)|Her|His,She|O pai dela mora no Brasil.|A dona é mulher: her.",
"g|That's ___ car.|Ben's|Ben,of Ben|Aquele é o carro do Ben.|O dono vem antes, com 's.",
"b|Esta é a minha irmã.|This is my sister.",
"b|Nossa casa é pequena.|Our house is small.",
"x|O celular da Ana é novo.|Ana's phone is new.|O dono vem antes, com 's.",

<script>
/* ============================================================
   MOTOR DO SITE. Não contém conteúdo de ensino: lê tudo de window.COURSE.
   ============================================================ */
(function(){
'use strict';
var C=window.COURSE;

/* ---------- utilidades ---------- */
function h(tag,attrs){
  var e=document.createElement(tag),k;
  if(attrs)for(k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  add(e,[].slice.call(arguments,2));return e;
}
function add(e,kids){kids.forEach(function(k){if(Array.isArray(k))return add(e,k);if(k==null||k===false)return;e.appendChild(k.nodeType?k:document.createTextNode(String(k)));});return e;}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sp(s){return s.split('|');}
function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);}
function btn(label,fn,cls){return h('button',{class:'btn'+(cls?' '+cls:''),type:'button',onclick:fn},label);}
function link(label,fn){return h('button',{class:'linkbtn',type:'button',onclick:fn},label);}
var NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'");
  s=s.replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
   .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is')
   .replace(/\bgonna\b/g,'going to').replace(/\bwanna\b/g,'want to').replace(/\bok\b/g,'okay');
  s=s.replace(/[^a-z0-9à-ú ]/g,' ').replace(/\b(\d|1[0-2])\b/g,function(m){return NUM[+m];});
  return s.replace(/\s+/g,' ').trim();
}
function words(s){var n=norm(s);return n?n.split(' '):[];}
function clean(w){return w.replace(/[.,!?;:"“”…()]/g,'');}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=0;j<=b.length;j++)m[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function checkTyped(val,alts){var v=norm(val),best=99;if(!v)return 0;
  for(var i=0;i<alts.length;i++){var a=norm(alts[i]);if(a===v)return 1;best=Math.min(best,lev(a,v));}
  return best<=Math.max(1,Math.floor(v.length/10))?0.5:0;}
function matchWords(target,heard){
  var hw=words(heard),marks=[],ok=0,tot=0;
  target.split(/\s+/).forEach(function(dw){var nw=words(dw);if(!nw.length){marks.push({w:dw,ok:true});return;}
    var all=true,idx=[];nw.forEach(function(w){var i=hw.indexOf(w);if(i<0)all=false;else idx.push(i);});
    tot+=nw.length;if(all){ok+=nw.length;idx.forEach(function(i){hw[i]=null;});}
    marks.push({w:dw,ok:all});});
  return {score:tot?ok/tot:0,marks:marks};
}

/* ---------- preparar o conteúdo ---------- */
var LESS={natural:{},grammar:{}},CARDS={},BYID={},WEEKS=[];
function parseX(s){var a=sp(s),k=a[0],al;
  if(k==='g')return{type:'gap',tpl:a[1],ans:a[2],ds:a[3].split(','),pt:a[4],why:a[5],en:a[1].replace('___',a[2]).replace(/\s*\([^)]*\)/,'')};
  if(k==='b'){al=a[2].split('/');return{type:'build',pt:a[1],en:al[0],alts:al};}
  if(k==='t'){al=a[3].split('/');return{type:'build',src:a[1],ins:a[2],en:al[0],alts:al,why:a[4],pt:''};}
  if(k==='x'){al=a[2].split('/');return{type:'type',pt:a[1],en:al[0],alts:al,why:a[3]};}
  return{type:'speak',en:a[1],pt:a[2]};}
(function prep(){
  Object.keys(C.weeks).map(Number).sort(function(a,b){return a-b;}).forEach(function(w){
    WEEKS.push(w);
    ['natural','grammar'].forEach(function(tr){
      LESS[tr][w]=(C.weeks[w][tr]||[]).map(function(r,i){
        var L={id:r.id,track:tr,week:w,idx:i,title:r.t,sit:r.sit||'',can:r.can||'',why:r.w||'',explain:r.ex||'',err:r.err||[]};
        var spk=[];
        L.dialog=(r.d||[]).map(function(s){var a=sp(s);if(spk.indexOf(a[0])<0)spk.push(a[0]);return{s:a[0],en:a[1],pt:a[2],v:spk.indexOf(a[0])};});
        L.cards=(r.c||r.e||[]).map(function(s,j){var a=sp(s),c={id:r.id+'.'+j,en:a[0],pt:a[1],week:w};CARDS[c.id]=c;return c;});
        L.subs=(r.s||[]).map(function(f){var fr=sp(f[0]);return{en:fr[0],pt:fr[1],opts:f.slice(1).map(function(o){var a=sp(o);return{en:a[0],pt:a[1]};})};});
        L.q=(r.q||[]).map(function(s){var a=sp(s);return{ask:a[0],pt:a[1],starter:a[2]};}).concat((r.p||[]).map(function(s){var a=sp(s);return{pt:a[0],starter:a[1]};}));
        L.k=(r.k||[]).map(function(a){return{q:a[0],opts:a.slice(1)};});
        L.x=(r.x||[]).map(parseX);
        BYID[L.id]=L;return L;});
    });
  });
  C.survival.forEach(function(s,i){var a=sp(s);CARDS['sv.'+i]={id:'sv.'+i,en:a[0],pt:a[1],week:0};});
})();
var MAXW=WEEKS[WEEKS.length-1]||0;
var ALLCARDS=Object.keys(CARDS).map(function(k){return CARDS[k];});

/* ---------- armazenamento e perfis ---------- */
var KEY='ingles-da-familia-v1',storageOK=true,DB=null;
try{DB=JSON.parse(localStorage.getItem(KEY));}catch(e){storageOK=false;}
if(!DB||!DB.profiles)DB={v:1,cur:null,theme:'auto',profiles:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));storageOK=true;}catch(e){storageOK=false;}}
function P(){return (DB.cur&&DB.profiles[DB.cur])||null;}
function newProfile(name){return{id:'p'+Date.now().toString(36)+rnd(99),name:name,track:null,placed:false,level:1,
  pos:{natural:{w:1,d:0},grammar:{w:1,d:0}},done:{},cards:{},bt:[],days:{},hist:[],pron:{},conv:{},rhy:{},slow:false,hide:false,best:0,last:0};}
function dayRec(){var p=P(),t=today();if(!p.days[t])p.days[t]=[0,0,0,0];return p.days[t];}
function addSpeak(sec){if(P()){dayRec()[1]+=Math.min(30,Math.max(1,Math.round(sec)));save();}}
function record(ok){var p=P();if(!p)return;p.hist.push(ok===1?1:0);if(p.hist.length>20)p.hist.shift();dayRec()[2]++;save();}
function adj(){var hh=P().hist;if(hh.length<8)return 0;var a=hh.reduce(function(x,y){return x+y;},0)/hh.length;return a>0.9?1:a<0.65?-1:0;}
var lastAct=Date.now();
['pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,function(){lastAct=Date.now();},true);});
var tickN=0;

function grade(id,ok){var st=P().cards[id];if(!st)return;var t=today();

  else{st[0]=st[0]>2?1:0;st[1]=t+1;st[3]++;}
  st[2]++;save();}
function dueCards(){var p=P(),t=today();return Object.keys(p.cards).filter(function(id){return CARDS[id]&&p.cards[id][1]<=t;}).sort(function(a,b){return p.cards[a][1]-p.cards[b][1];});}
function learnCards(list){var p=P(),t=today();list.forEach(function(c){if(!p.cards[c.id])p.cards[c.id]=[0,t+1,0,0];});}
function stats(){var p=P(),t=today(),sec=0,spk=0,daysN=0,k;
  for(k in p.days){sec+=p.days[k][0];spk+=p.days[k][1];if(p.days[k][2]>0||p.days[k][3]>0)daysN++;}
  function act(d){return p.days[d]&&(p.days[d][2]>0||p.days[d][3]>0);}
  var s=0,d=act(t)?t:t-1;while(act(d)){s++;d--;}
  var ids=Object.keys(p.cards).filter(function(id){return CARDS[id];}),ws={};
  ids.forEach(function(id){words(CARDS[id].en).forEach(function(w){ws[w]=1;});});
  return{min:Math.round(sec/60),hours:sec/3600,speak:Math.round(spk/60),days:daysN,streak:s,
    cards:ids.length,mastered:ids.filter(function(id){return p.cards[id][0]>=4;}).length,words:Object.keys(ws).length,due:dueCards().length};}

var TTS={ok:('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined'),voices:[]};
var NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|pipe|junior|ralph|fred|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;
function loadVoices(){try{
  var v=speechSynthesis.getVoices().filter(function(x){return /^en([-_]|$)/i.test(x.lang)&&!NOVELTY.test(x.name);});
  function sc(x){return (/en[-_]US/i.test(x.lang)?4:0)+(/google|natural|samantha|enhanced|premium/i.test(x.name)?2:0)+(x.localService?1:0);}
  v.sort(function(a,b){return sc(b)-sc(a);});TTS.voices=v.slice(0,4);}catch(e){}}
if(TTS.ok){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
var lastText='',vTick=0,playTok=0,liveTimer=null;
function stopAudio(){playTok++;if(liveTimer){clearInterval(liveTimer);liveTimer=null;}try{if(TTS.ok)speechSynthesis.cancel();}catch(e){}}
function say(text,o){o=o||{};return new Promise(function(res){
  if(!TTS.ok)return res(false);
  try{speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text),vs=TTS.voices,v=null,p=P();
    if(vs.length){if(o.voice==='rand')v=pick(vs);else if(typeof o.voice==='number')v=vs[o.voice%vs.length];
      else{if(text!==lastText){vTick++;lastText=text;}v=vs[vTick%vs.length];}}
    u.lang=v?v.lang:'en-US';if(v)u.voice=v;u.rate=o.rate||((p&&p.slow)?0.72:0.95);
    var done=false,fin=function(ok){if(!done){done=true;res(ok);}};
    u.onend=function(){fin(true);};u.onerror=function(){fin(false);};

  }catch(e){res(false);}});}
function audioBtns(text,o){o=o||{};

var SRC=window.SpeechRecognition||window.webkitSpeechRecognition||null,micBlocked=false;

function speakBox(target,o){
  o=o||{};var box=h('div',{class:'speak'}),out=h('div',{class:'heard'}),note='';
  function render(){
    box.textContent='';var mode=micMode();
    if(mode==='sr'){var b=btn('Falar',function(){startSR(b);},'mic');box.appendChild(b);}
    else if(mode==='rec'){var r=btn('Gravar minha voz',function(){startRec(r);},'mic');box.appendChild(r);}
    else box.appendChild(h('p',{class:'note'},'Diga em voz alta, com calma. '+(note||'Aqui o microfone não está disponível, então você mesmo avalia.')));
    if(note&&mode!=='self')box.appendChild(h('p',{class:'note'},note));
    box.appendChild(out);
  }
  function show(alts){
    out.textContent='';var best=alts[0],m=null;
    if(target){alts.forEach(function(a){var r=matchWords(target,a);if(!m||r.score>m.score){m=r;best=a;}});
      out.appendChild(h('p',{class:'w'},m.marks.map(function(k){return h('span',{class:k.ok?'ok':'no'},k.w);})));
      out.appendChild(h('p',{class:'small'},m.score>=0.8?'Entendi tudo. Muito bem!':m.score>=0.5?'Entendi quase tudo. As palavras sublinhadas não ficaram claras.':'Entendi pouco. Ouça o modelo e tente de novo.'));}
    out.appendChild(h('p',{class:'small muted'},'O aparelho ouviu: “'+best+'”'));

  function startSR(b){
    var t0=Date.now(),r;stopAudio();

    r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
    b.textContent='Ouvindo… fale agora';b.classList.add('live');b.disabled=true;out.textContent='';
    r.onresult=function(e){var alts=[];for(var i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);show(alts);};
    r.onerror=function(e){
      if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){micBlocked=true;note='O microfone não foi liberado aqui.';render();}
      else if(e.error==='network'){micBlocked=true;note='Sem internet, este aparelho não reconhece a fala.';render();}
      else out.textContent='Não ouvi nada. Toque em Falar e tente de novo.';};
    r.onend=function(){addSpeak((Date.now()-t0)/1000);b.textContent='Falar de novo';b.classList.remove('live');b.disabled=false;};
    try{r.start();}catch(e){micBlocked=true;render();}
  }
  function startRec(b){
    stopAudio();
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      var mr=new MediaRecorder(st),chunks=[],t0=Date.now(),to;
      mr.ondataavailable=function(e){chunks.push(e.data);};
      mr.onstop=function(){clearTimeout(to);st.getTracks().forEach(function(t){t.stop();});addSpeak((Date.now()-t0)/1000);
        var url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));
        b.textContent='Gravar de novo';b.classList.remove('live');b.onclick=null;
        out.textContent='';
        out.appendChild(h('div',{class:'audio'},
          h('button',{class:'abtn',type:'button',onclick:function(){try{new Audio(url).play();}catch(e){}}},'▶ Minha voz'),
          target&&h('button',{class:'abtn slow',type:'button',onclick:function(){say(target);}},'▶ Modelo')));
        out.appendChild(h('p',{class:'small muted'},'Compare as duas e repita até ficar parecido.'));
        if(o.onResult)o.onResult(null,null);};
      mr.start();b.textContent='Parar a gravação';b.classList.add('live');
      var stop=function(){if(mr.state!=='inactive')mr.stop();};
      b.onclick=stop;to=setTimeout(stop,12000);
    }).catch(function(){recBlocked=true;note='O microfone não foi liberado aqui.';render();});
  }
  render();return box;
}

function plan(){
  var p=P(),tr=p.track,pos=p.pos[tr],wk=LESS[tr][pos.w];

  if(pl.kind==='fluency'){
    var a=pick(pl.wk),b=pick(pl.wk.filter(function(x){return x!==a;}))||a;
    st.push(sDialog(a,{again:true,label:'Escuta'}));
    st.push({label:'Tradução de volta',run:function(el,next){backTrans(el,b,next);}});
    st.push({label:'Fala e ouvido',run:function(el,next){pairDrill(el,pickSound(),8,function(){shadow(el,a.dialog.slice(0,4),next);});}});
    st.push({label:'Rapidez',run:speedRound});

      el.appendChild(btn('Treinar',function(){rhythmQuiz(el,rh,next);}));}});

  $main.appendChild(h('div',{class:'card'},h('h2',null,p.name),h('p',{class:'muted'},'Trilha da sessão diária: '+(p.track==='natural'?'Natural':'Gramática')+' · semana '+p.pos[p.track].w),
    btn('Trocar para a trilha '+(p.track==='natural'?'Gramática':'Natural'),function(){p.track=p.track==='natural'?'grammar':'natural';save();render();},'sec'),
    btn('Trocar de pessoa',function(){DB.cur=null;save();render();},'sec'),
    btn('Refazer o teste de nível',function(){p.placed=false;save();render();},'quiet')));
  $main.appendChild(h('div',{class:'card'},h('h2',null,'Aparência'),h('div',{class:'row'},[['auto','Automática'],['light','Clara'],['dark','Escura']].map(function(t){
    return btn(t[1],function(){DB.theme=t[0];save();render();},DB.theme===t[0]?'':'sec');}))));
  var code='IF1:'+btoa(unescape(encodeURIComponent(JSON.stringify(p)))),msg=h('p',{class:'small'});
  var ta=h('textarea',{class:'inp',id:'codigo-exportar',readonly:true,'aria-label':'Seu código de progresso'},code);
  $main.appendChild(h('div',{class:'card'},h('h2',null,'Levar meu progresso para outro aparelho'),
    h('p',{class:'muted small'},'Copie este código e envie para você mesmo, por mensagem ou e-mail. No outro aparelho, abra o site e escolha “Já estudei em outro aparelho”. Guarde uma cópia de vez em quando, por segurança.'),ta,
    btn('Copiar o código',function(){ta.focus();ta.select();
      try{navigator.clipboard.writeText(code).then(function(){msg.textContent='Código copiado.';},function(){msg.textContent='Segure o dedo sobre o código e escolha Copiar.';});}
      catch(e){msg.textContent='Segure o dedo sobre o código e escolha Copiar.';}}),msg));
  $main.appendChild(h('details',null,h('summary',null,'Trazer progresso de outro aparelho'),importBox()));
  if(!storageOK)$main.appendChild(h('p',{class:'note'},'Este navegador não está guardando dados. Copie o código acima ao terminar cada sessão.'));
  var del=btn('Apagar este perfil',function(){
    if(del.dataset.sure){delete DB.profiles[p.id];DB.cur=null;save();render();}
    else{del.dataset.sure='1';del.textContent='Toque de novo para apagar tudo de '+p.name;}},'danger');
  $main.appendChild(del);
}

var VIEWS={hoje:vToday,natural:function(){vTrackTab('natural');},gramatica:function(){vTrackTab('grammar');},falar:vSpeak,revisao:vReview,progresso:vProgress};
window.__app={go:go,P:P,DB:function(){return DB;},save:save,render:render,today:today};
render();
})();
